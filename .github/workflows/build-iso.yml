name: Build RebuiltFedora XFCE ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kickstarts/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

env:
  IMAGE_NAME: rebuiltfedora-xfce
  FEDORA_RELEASE: '44'

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Validate Kickstart
        run: |
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            fedora:${FEDORA_RELEASE} \
            bash -c 'dnf -y install pykickstart && ksvalidator /workspace/kickstarts/rebuiltfedora-xfce.ks'

      - name: Build ISO inside Fedora
        run: |
          mkdir -p output
          podman run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            -w /workspace \
            fedora:${FEDORA_RELEASE} \
            bash -c '
              set -eux
              dnf -y update
              dnf -y install \
                lorax \
                pykickstart \
                xorriso \
                squashfs-tools \
                syslinux \
                dosfstools \
                isomd5sum

              ksvalidator kickstarts/rebuiltfedora-xfce.ks
              mkdir -p /workspace/output

              livemedia-creator \
                --make-iso \
                --ks /workspace/kickstarts/rebuiltfedora-xfce.ks \
                --location https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_RELEASE}/Everything/x86_64/os/ \
                --no-virt \
                --resultdir /workspace/output \
                --project RebuiltFedora \
                --volid REBUILTFEDORA_XFCE
            '

      - name: List build output
        if: always()
        run: |
          find output -maxdepth 2 -type f -print 2>/dev/null || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltFedora-XFCE-ISO
          path: output/*.iso
          if-no-files-found: error
          retention-days: 14
