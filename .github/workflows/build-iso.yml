name: Build RebuiltFedora XFCE ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kickstarts/**'
      - 'branding/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

env:
  IMAGE_NAME: rebuiltfedora-xfce
  FEDORA_RELEASE: '44'

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Validate Kickstart
        run: |
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            fedora:"$FEDORA_RELEASE" \
            bash -c '
              set -euo pipefail
              dnf -y install pykickstart
              ksvalidator /workspace/kickstarts/rebuiltfedora-xfce.ks
            '

      - name: Prepare loop devices
        run: |
          set -euo pipefail
          sudo modprobe loop || true
          for i in $(seq 0 15); do
            if [ ! -e "/dev/loop$i" ]; then
              sudo mknod -m 0666 "/dev/loop$i" b 7 "$i"
            else
              sudo chmod 0666 "/dev/loop$i"
            fi
          done
          if [ ! -e /dev/loop-control ]; then
            sudo mknod -m 0666 /dev/loop-control c 10 237
          else
            sudo chmod 0666 /dev/loop-control
          fi
          sudo losetup -D || true
          echo "Host loop devices:"
          ls -l /dev/loop* || true
          sudo losetup -f

      - name: Build ISO inside Fedora
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/output"

          # livemedia-creator needs real loop block devices for its temporary
          # disk image. Pass every loop device explicitly into the container;
          # --privileged alone does not guarantee that Podman exposes the
          # host's loop devices to the container.
          DEVICE_ARGS="--device=/dev/loop-control"
          for i in $(seq 0 15); do
            DEVICE_ARGS="$DEVICE_ARGS --device=/dev/loop$i"
          done

          podman run --rm --privileged \
            $DEVICE_ARGS \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            -w /workspace \
            -e FEDORA_RELEASE="$FEDORA_RELEASE" \
            fedora:"$FEDORA_RELEASE" \
            bash -c '
              set -euo pipefail

              : "${FEDORA_RELEASE:?FEDORA_RELEASE must be set}"

              dnf -y update
              dnf -y install \
                anaconda \
                lorax \
                lorax-lmc-novirt \
                pykickstart \
                xorriso \
                squashfs-tools \
                syslinux \
                dosfstools \
                isomd5sum

              command -v livemedia-creator
              livemedia-creator -V

              ksvalidator /workspace/kickstarts/rebuiltfedora-xfce.ks
              rm -rf /workspace/output

              echo "Container loop devices:"
              ls -l /dev/loop* 2>/dev/null || true
              losetup -D || true
              LOOP_DEV="$(losetup -f)"
              echo "Free loop device: $LOOP_DEV"

              # Build the actual bootable ISO.
              livemedia-creator \
                --make-iso \
                --ks /workspace/kickstarts/rebuiltfedora-xfce.ks \
                --location "https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_RELEASE}/Everything/x86_64/os/" \
                --no-virt \
                --resultdir /workspace/output \
                --project RebuiltFedora \
                --volid REBUILTFEDORA_XFCE
            '

      - name: List build output
        if: always()
        run: |
          echo "Build output:"
          find output -maxdepth 2 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltFedora-XFCE-ISO
          path: output/*.iso
          if-no-files-found: error
          retention-days: 14
