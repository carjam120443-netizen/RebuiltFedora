name: Build RebuiltFedora XFCE ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kickstarts/**'
      - 'branding/**'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

env:
  IMAGE_NAME: rebuiltfedora-xfce
  FEDORA_RELEASE: '44'

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Validate Kickstart
        run: |
          podman run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            fedora:"$FEDORA_RELEASE" \
            bash -c '
              set -euo pipefail
              dnf -y install pykickstart
              ksvalidator /workspace/kickstarts/rebuiltfedora-xfce.ks
            '

      - name: Build ISO inside Fedora
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/output"

          # livemedia-creator creates a temporary disk image and attaches it
          # with losetup. GitHub-hosted runners do not always expose enough
          # loop devices inside the privileged Podman container, so create a
          # small pool explicitly before starting the Fedora build.
          sudo modprobe loop || true
          for i in $(seq 0 15); do
            if [ ! -e "/dev/loop$i" ]; then
              sudo mknod -m 0660 "/dev/loop$i" b 7 "$i"
            fi
          done
          sudo mknod -m 0660 /dev/loop-control c 10 237 2>/dev/null || true
          sudo chmod 0666 /dev/loop-control /dev/loop[0-9]* 2>/dev/null || true
          losetup -f || true

          podman run --rm --privileged \
            --device /dev/loop-control \
            -v "$GITHUB_WORKSPACE:/workspace:Z" \
            -w /workspace \
            -e FEDORA_RELEASE="$FEDORA_RELEASE" \
            fedora:"$FEDORA_RELEASE" \
            bash -c '
              set -euo pipefail

              : "${FEDORA_RELEASE:?FEDORA_RELEASE must be set}"

              dnf -y update
              dnf -y install \
                anaconda \
                lorax \
                lorax-lmc-novirt \
                pykickstart \
                xorriso \
                squashfs-tools \
                syslinux \
                dosfstools \
                isomd5sum

              # lorax-lmc-novirt provides livemedia-creator.
              command -v livemedia-creator
              livemedia-creator -V

              ksvalidator /workspace/kickstarts/rebuiltfedora-xfce.ks

              # livemedia-creator requires the result directory to not exist.
              rm -rf /workspace/output

              # Verify loop support before the expensive Anaconda stage.
              echo "Available loop devices:"
              ls -l /dev/loop* 2>/dev/null || true
              losetup -f

              # Build the actual bootable ISO.
              livemedia-creator \
                --make-iso \
                --ks /workspace/kickstarts/rebuiltfedora-xfce.ks \
                --location "https://download.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_RELEASE}/Everything/x86_64/os/" \
                --no-virt \
                --resultdir /workspace/output \
                --project RebuiltFedora \
                --volid REBUILTFEDORA_XFCE
            '

      - name: List build output
        if: always()
        run: |
          echo "Build output:"
          find output -maxdepth 2 -type f -printf '%p (%s bytes)\n' 2>/dev/null || true

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebuiltFedora-XFCE-ISO
          path: output/*.iso
          if-no-files-found: error
          retention-days: 14
